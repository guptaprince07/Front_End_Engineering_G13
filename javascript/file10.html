<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var d = new Date();

document.write("<b> Locale String: </b>" + d.toLocaleString() + "<br>");

document.write("<b> Full Month: </b>" + 
    d.toLocaleString('default', { month: 'long' }) + "<br>");

document.write("<b> Weekday Name: </b>" +
    d.toLocaleString('default', { weekday: 'long' }) + "<br>");

document.write("<b>Hours: </b>" + d.getHours() + "<br>");

document.write("<b>Day: </b>" + d.getDate() + "<br>");

mnt = d.getMonth() + 1; // Months are zero-based, so we add 1
document.write("<b>Month: </b>" + mnt + "<br>");

document.write("<b>FullYear: </b>" + d.getFullYear() + "<br>");

document.write("<b>Minutes: </b>" + d.getMinutes() + "<br>");

document.write("<b>Seconds: </b>" + d.getSeconds() + "<br>");
    </script>
</body>
</html>
