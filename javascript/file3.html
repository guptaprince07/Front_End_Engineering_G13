<body>
    <script>
        //prompt always takes string
        var num1=parseInt(prompt("enter no 1:"));
        var num2=parseInt(prompt("enter num 2:"));
        //parseInt to typecast string into int 
        sum=num1+num2;
        console.log("Sum is ",sum);
    </script>
