<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var count = parseInt(prompt("How many items do you want in the list?"));
        document.write("<ol>");
        for (var i = 1; i <= count; i++) {
            var item = prompt("Enter name for item " + i + ":");
            document.write("<li>" + item + "</li>");
        }
        document.write("</ol>");
    </script>
</body>
</html>
