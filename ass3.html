<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
            padding: 20px;
        }

        .shadow {
            background-image: url("https://th.bing.com/th/id/OIGP.90plJIRWoTQ1wngkWXnL?w=228&h=228&c=6&r=0&o=7&dpr=1.3&pid=1.7&rm=3.jpg");
            width: 260px;
            height: 260px;
            padding: 15px;
            border: 1px solid blue;
            background-color: cyan;
            box-shadow: 10px 10px cadetblue;
            background-repeat: no-repeat;
            transition: box-shadow 1s ease;
        }
        #inside:checked ~ .shadow {
            box-shadow: inset 10px 10px cadetblue;
        }

        .controls {
            display: flex;
            gap: 15px;
            font-family: sans-serif;
            font-size: 14px;
        }

        .controls label {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="outside">Button 1</label>
        <label for="inside">Button 2</label>
    </div>

    Placed right before .shadow so ~ target finds it 
    <input type="radio" id="outside" name="shadow-type" checked hidden>
    <input type="radio" id="inside" name="shadow-type" hidden>

    <div class="shadow"></div>

</body>
</html>
