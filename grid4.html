<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Board</title>
    <style>
        .controls {
            width: 480px;
            margin: 20px auto 15px auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: sans-serif;
        }

        #toggle-color {
            accent-color: green;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .controls label {
            cursor: pointer;
            font-weight: 500;
        }

        .conatiner {
            display: grid;
            border: 2px solid navy;
            box-shadow: 5px 5px 4px lightslategrey;
            width: 480px;
            height: 480px;
            margin: auto;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
        }

        .black {
            background-color: black;
            width: 60px;
            height: 60px;
        }

        .white {
            background-color: white;
            width: 60px;
            height: 60px;
        }

        .controls:has(#toggle-color:checked) ~ .conatiner .white {
            background-color: yellow;
        }

        .controls:has(#toggle-color:checked) ~ .conatiner .black {
            background-color: maroon;
        }
    </style>
</head>
<body>

    <div class="controls">
        <input type="checkbox" id="toggle-color">
        <label for="toggle-color">Change Color </label>
    </div>

    <div class="conatiner">
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>

        <div class="white"></div>

        <div class="black"></div>

        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>
    </div>

</body>
</html>
