<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .sq{
            width: 200px;
            height: 200px;
            margin: auto;
            position: relative;
            top: 150px;
            border: 6px solid cyan;
            background-color: yellow;
            animation:circular 1s infinite linear;  
            /* without linear break lega and with linear ghume jayega */
        }
        @keyframes circular {
            0%{transform: rotate(0deg);}
            100%{transform: rotate(360deg);}
        }
    </style>
</head>
<body>
    <div class="sq"></div>
</body>
</html>
