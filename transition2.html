<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .h1{
            color: green;
            text-align: center;
            text-decoration: underline;
        }
        div.sq{
            height: 150px;
            width: 150px;
            border: 1px dashed black;
            margin: auto;
            background: pink;
            transition: height 2s,width 2s, background 2s;
        }
        div.sq:hover{
            height: 300px;
            width: 300px;
            background: cyan;
        }
    </style>
</head>
<body>
    <h1>Mouse hover</h1>
    <div class="sq"></div>
</body>
</html>
