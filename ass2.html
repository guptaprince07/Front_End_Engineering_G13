<!DOCTYPE html>
<html>
<head>

<style>

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f2f2f2;
}
.container{
    display:flex;
    flex-direction:column;
    gap:40px;
}


.row{
    display:flex;
    gap:25px;
}


input{
    display:none;
}

.box{
    width:180px;
    height:180px;
    border:3px solid black;
    background:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

.mini-box{
    width:35px;
    height:35px;
    border:2px solid black;
    margin-bottom:8px;
}

span{
    font-size:13px;
}

#red1:checked + .box,
#red2:checked + .box,
#red3:checked + .box{
    background:red;
}

#green1:checked + .box,
#green2:checked + .box,
#green3:checked + .box{
    background:green;
}


input:checked + .box .mini-box,
input:checked + .box span{
    display:none;
}
</style>
</head>
<body>
<div class="container">


<div class="row">

<input type="checkbox" id="red1">
<label class="box" for="red1">
    <div class="mini-box"></div>
    <span>Red</span>
</label>


<input type="checkbox" id="red2">
<label class="box" for="red2">
    <div class="mini-box"></div>
    <span>Red</span>
</label>


<input type="checkbox" id="red3">
<label class="box" for="red3">
    <div class="mini-box"></div>
    <span>Red</span>
</label>

</div>

<div class="row">

<input type="checkbox" id="green1">
<label class="box" for="green1">
    <div class="mini-box"></div>
    <span>Green</span>
</label>
<input type="checkbox" id="green2">
<label class="box" for="green2">
    <div class="mini-box"></div>
    <span>Green</span>
</label>
<input type="checkbox" id="green3">
<label class="box" for="green3">
    <div class="mini-box"></div>
    <span>Green</span>
</label>
</div>
</div>
</body>
</html>
