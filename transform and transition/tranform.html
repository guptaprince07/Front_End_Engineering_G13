<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.main{
            margin-left: 100px;
        }
        div.a{
            width: 150px;
            background-color: yellow;
            transform: rotate(20deg);
            border: 2px solid blue;
        }
        div.b{
            width: 150px;
            background-color: yellow;
            transform: skew(20deg);
            border: 2px solid blue;
        }
        div.c{
            width: 150px;
            background-color: yellow;
            transform: scale(20deg);
            border: 2px solid blue;
        }

    </style>
</head>
<body>
    <div class="main">
        <h1>CSS transoform example</h1>
        <h2>
            transform:rotate; </h2>
            <div class="a">Hello friends</div>
            <br><br>
        <h2>tranform skew</h2>
        <div class="b">Hello friends</div>
        <br><br>

        <h2>tranform scale</h2>
        <div class="c">Hello friends</div>
        <br><br>
    </div>
</body>
</html>
