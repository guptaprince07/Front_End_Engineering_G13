<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            display: grid;
            width: 100vw;
            height: 100vh;
            text-align: center;
            grid-template-columns: 3fr 5fr 5fr;
            grid-template-rows: 182px 516px 516px;
        }
        .header{
            grid-column-start: 1;
            grid-column-end: 4;
        }
        .menu{
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 2;
            grid-row-end: 3;
        }
        .main{
            grid-column-start: 2;
            grid-column-end: 4;
            grid-row-start: 2;
            grid-row-end: 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" style="background-color: red;"><h1>Header</h1></div>
        <div class="menu" style="background-color: blue;"><h1>Menu</h1></div>
        <div class="main" style="background-color: black;"><h1>Main</h1></div>
    </div>
</body>
</html>
