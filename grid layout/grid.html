<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            width: 100vw;
            height: 100vh;
            display: grid;
            /* margin: auto; */
            text-align: center;
            /* padding: 20px; */
            grid-template-columns: 495px 495px 495px;
            grid-template-rows: 219px 219px 219px;
            grid-column-gap: 20px;
            grid-row-gap: 20px;
        }
    </style>
</head>
<body>
    <div class ="container">
        <div class="item1" style="background-color:red">item1</div>
        <div class="item2" style="background-color:green">item2</div>
        <div class="item3" style="background-color:blue">item3</div>
        <div class="item4" style="background-color:lightblue">item4</div>
        <div class="item5" style="background-color:lightpink">item5</div>
        <div class="item6" style="background-color:lightgreen">item6</div>
        <div class="item7" style="background-color:darkblue">item7</div>
        <div class="item8" style="background-color:darkmagenta">item8</div>
        <div class="item9" style="background-color:darkorange">item9</div>
    </div>
</body>
</html>
