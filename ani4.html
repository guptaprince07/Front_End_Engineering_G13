<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 400px;
            margin: auto;
            border: 2px solid navy;
            height: 20px;
        }
        .sq{
            width: 0%;
            height: 100%;
            background: red;
            position: relative;
            animation: mymoves 5s linear forwards;
        }
        @keyframes mymoves{
            0%   {width: 0%; }
            25%  {width: 25%; }
            50%  {width: 50%; }
            75%  {width: 75%; }
            100% {width: 100%; }
        }
        .load{
            width: 400px;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sq"></div>
    </div>
    <div class="load">Loading..</div>
</body>
</html>
