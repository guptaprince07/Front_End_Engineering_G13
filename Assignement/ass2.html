<!DOCTYPE html>
<html>
<head>

<style>

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f2f2f2;
    margin: 0;
}

.container{
    display:flex;
    flex-direction:column;
    gap:40px;
}

.row{
    display:flex;
    gap:25px;
}

.box{
    width:180px;
    height:180px;
    border:3px solid black;
    background:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transition: background 0.2s ease;
}

.checkbox-input {
    width: 22px;
    height: 22px;
    margin-bottom: 8px;
    cursor: pointer;
}

.box label {
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}
.box:has(.checkbox-input:checked) .checkbox-input,
.box:has(.checkbox-input:checked) label {
    display: none;
}
.box:has(#red1:checked),
.box:has(#red2:checked),
.box:has(#red3:checked) {
    background: red;
}

.box:has(#green1:checked),
.box:has(#green2:checked),
.box:has(#green3:checked) {
    background: green;
}

</style>
</head>
<body>

<div class="container">

    <div class="row">
        <div class="box">
            <input type="checkbox" id="red1" class="checkbox-input">
            <label for="red1">Red</label>
        </div>

        <div class="box">
            <input type="checkbox" id="red2" class="checkbox-input">
            <label for="red2">Red</label>
        </div>

        <div class="box">
            <input type="checkbox" id="red3" class="checkbox-input">
            <label for="red3">Red</label>
        </div>
    </div>

    <div class="row">
        <div class="box">
            <input type="checkbox" id="green1" class="checkbox-input">
            <label for="green1">Green</label>
        </div>

        <div class="box">
            <input type="checkbox" id="green2" class="checkbox-input">
            <label for="green2">Green</label>
        </div>

        <div class="box">
            <input type="checkbox" id="green3" class="checkbox-input">
            <label for="green3">Green</label>
        </div>
    </div>

</div>

</body>
</html>
